<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/style.css">
<title>Textile Engineering Toolkit V1</title>
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">TEXTILE ENGINEERING</div>
    <h1>Toolkit <span>V1</span></h1>
  </div>
  <button id="installBtn" class="ghost hidden">Install</button>
</header>

<main>
  <section class="hero">
    <h2>Fabric calculation, made simple.</h2>
    <p>Calculate Cotton Count (Ne) and Fabric GSM with transparent engineering formulas.</p>
  </section>

  <nav class="tabs" aria-label="Calculator">
    <button class="tab active" data-tab="count">🧶 Cotton Count</button>
    <button class="tab" data-tab="gsm">⚖️ GSM</button>
  </nav>

  <section id="count" class="panel active">
    <div class="grid">
      <label>Length
        <input id="countLength" type="number" step="any" min="0" placeholder="e.g. 100">
      </label>
      <label>Length unit
        <select id="countLengthUnit"><option value="yd">Yard</option><option value="in">Inch</option><option value="cm">Centimeter</option></select>
      </label>
      <label>Weight
        <input id="countWeight" type="number" step="any" min="0" placeholder="e.g. 2.5">
      </label>
      <label>Weight unit
        <select id="countWeightUnit"><option value="g">Gram</option></select>
      </label>
    </div>
    <button id="countCalc" class="primary">Calculate Cotton Count</button>
    <div id="countResult" class="result hidden"></div>
  </section>

  <section id="gsm" class="panel">
    <div class="grid">
      <label>Weight
        <input id="gsmWeight" type="number" step="any" min="0" placeholder="e.g. 250">
      </label>
      <label>Weight unit
        <select id="gsmWeightUnit"><option value="g">Gram</option></select>
      </label>
      <label>Length
        <input id="gsmLength" type="number" step="any" min="0" placeholder="e.g. 2">
      </label>
      <label>Width
        <input id="gsmWidth" type="number" step="any" min="0" placeholder="e.g. 1.5">
      </label>
      <label>Length & width unit
        <select id="gsmUnit"><option value="m">Meter</option><option value="cm">Centimeter</option><option value="in">Inch</option></select>
      </label>
    </div>
    <button id="gsmCalc" class="primary">Calculate GSM</button>
    <div id="gsmResult" class="result hidden"></div>
  </section>

  <section class="history">
    <div class="history-head">
      <h3>Calculation History</h3>
      <button id="clearHistory" class="ghost">Clear</button>
    </div>
    <div id="historyList" class="history-list"><p class="muted">No calculations yet.</p></div>
  </section>
</main>

<footer>Textile Engineering Toolkit V1 • Built for future textile modules</footer>
<script src="js/unit-converter.js"></script>
<script src="js/cotton-count.js"></script>
<script src="js/gsm.js"></script>
<script src="js/database.js"></script>
<script src="js/app.js"></script>
</body>
</html>
